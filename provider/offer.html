<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teklif ver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="dashboard.html" style="font-weight: 700; color: var(--text); text-decoration: none;">Güvenlik Pazar · Sağlayıcı</a>
    <div class="nav-buttons">
      <a href="requests.html" class="btn btn-secondary">Taleplere dön</a>
      <a href="../login.html" class="btn btn-primary">Çıkış</a>
    </div>
  </nav>

  <main class="form-page">
    <a href="requests.html" class="back">← Taleplere dön</a>
    <h1>Teklif ver</h1>
    <p style="color: var(--text-muted); font-size: 0.9375rem; margin: 0 0 1.5rem;">Talep: Fiziki güvenlik – İstanbul, Kadıköy (örnek)</p>

    <form class="form-card" id="form-offer">
      <div class="form-group">
        <label for="amount">Aylık teklif bedeli (TL) <span style="color: var(--accent);">*</span></label>
        <input type="number" id="amount" name="amount" required min="0" placeholder="Örn: 65000">
      </div>
      <div class="form-group">
        <label for="description">Hizmet açıklaması <span style="color: var(--accent);">*</span></label>
        <textarea id="description" name="description" required rows="4" placeholder="Kapsam, koşullar, personel nitelikleri vb."></textarea>
      </div>
      <div class="form-group">
        <label for="start_days">Başlangıç süresi (gün)</label>
        <input type="number" id="start_days" name="start_days" min="1" placeholder="İşe kaç gün içinde başlanır (opsiyonel)">
      </div>
      <div class="form-group">
        <label for="notes">Ek notlar</label>
        <textarea id="notes" name="notes" rows="2" placeholder="Opsiyonel"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Teklifi Gönder</button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById('form-offer').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Teklif gönderimi şu an demo aşamasında. Backend bağlandığında alıcıya iletilecek.');
      window.location.href = 'requests.html';
    });
  </script>
</body>
</html>
